# The landing page and the documentation, published so anyone can open them:
# https://jimlah.github.io/design-system/ — the app at the root, Storybook beside it under
# /storybook/, which is the same pair the app already serves in dev and preview.
#
# `DEPLOY_BASE` is what tells the build it is going to a repository subpath: it becomes Vite's
# `base`, the router's `basepath`, and the prefix on the Home page's Storybook links. It is read from
# the event rather than typed, so the site cannot silently break if the repository is renamed.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and a newer commit makes the older deploy pointless.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      # The landing page, prerendered, so it arrives as real HTML rather than blank-before-JavaScript.
      - name: Build the app
        run: vp build
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/

      # The documentation — the build the app serves at /storybook/ in dev and preview.
      - run: npm run build-storybook

      - name: Assemble the site
        run: |
          mkdir site
          cp -R dist/client/. site/
          cp -R storybook-static site/storybook
          # One route on a file server: an unknown path is this app's own page, not GitHub's.
          cp dist/client/index.html site/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
